[package]
name = "video-creator-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "video-creator-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["stream"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "sync", "time", "io-util", "net"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
bytes = "=1.12.1"
futures-core = "=0.3.34"
sha2 = "=0.10.9"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast"] }
regex = "=1.13.1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes",
  "Win32_System_Threading", "Win32_NetworkManagement_IpHelper",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader", "Win32_Security_WinTrust",
  "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Networking_WinSock",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop",
] }
