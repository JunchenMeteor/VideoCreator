[project]
name = "video-creator-engine"
version = "0.1.0"
description = "Instance-owned video creation engine"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cryptography==50.0.2",
  "fastapi==0.142.2",
  "pydantic>=2.12,<2.13",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.3",
  "alembic==1.20.0",
  "pillow==12.3.0",
  "mcp~=1.28.1",
  "crewai==1.15.23",
  "platformdirs==4.12.3",
  "keyring==25.7.0",
  "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pyinstaller==6.22.3",
]

[project.scripts]
video-creator-engine = "video_creator.cli.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_creator"]
