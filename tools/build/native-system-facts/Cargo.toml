[package]
name = "video-creator-native-system-facts"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading",
  "Win32_System_SystemInformation", "Win32_System_LibraryLoader",
  "Win32_Security_WinTrust", "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip",
] }
